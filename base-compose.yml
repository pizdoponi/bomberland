version: "3"
services:
    game-engine:
        image: gocoderone/bomberland-engine:2477
        volumes:
            - type: "bind"
              source: ./agents/replay.json
              target: /app/replay.json

    bombwalker:
        build:
            context: agents/bombwalker
            dockerfile: Dockerfile.dev
        volumes:
            - ./agents/bombwalker:/app

    agentex:
        build:
            context: agents/agentex
            dockerfile: Dockerfile.dev
        volumes:
            - ./agents/agentex:/app

    kamikaze:
        build:
            context: agents/kamikaze
            dockerfile: Dockerfile.dev
        volumes:
            - ./agents/kamikaze:/app

    dqn:
        build:
            context: agents/dqn
            dockerfile: Dockerfile.dev
        volumes:
            - ./agents/dqn:/app

    dqn-train:
        build:
            context: agents/dqn
            dockerfile: Dockerfile.train
        volumes:
            - ./agents/dqn:/app

    python3-agent:
        build:
            context: agents/python3
            dockerfile: Dockerfile

    python3-agent-dev:
        build:
            context: agents/python3
            dockerfile: Dockerfile.dev
        volumes:
            - ./agents/python3:/app

    python3-fwd:
        build:
            context: agents/python3
            dockerfile: Dockerfile.fwd

    python3-fwd-dev:
        build:
            context: agents/python3
            dockerfile: Dockerfile.fwd.dev
        volumes:
            - ./agents/python3:/app
    python3-gym-dev:
        build:
            context: agents/python3
            dockerfile: Dockerfile.gym.dev
        volumes:
            - ./agents/python3:/app
